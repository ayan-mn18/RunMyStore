gs into</p></div><ul class="d-promises center-list reveal"><li>Your own payment account</li><li>Your data, export any time</li><li>Your own AI keys</li></ul></div></section><section class="d-faq" id="faq"><div class="d-wrap d-faq-grid"><div><p class="eyebrow-v reveal">Questions</p><h2 class="d-h2 reveal">The short <em>answers.</em></h2></div><div class="faq"><details name="v2-faq"><summary><span>What is RunMyStore?</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></summary><p>RunMyStore brings your storefront, catalog, ads, campaigns, and daily operations into one workspace. This interactive demo uses sample data saved in your browser.</p></details><details name="v2-faq"><summary><span>Is it an agency?</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></summary><p>Open the demo to explore Northwind, use a local catalog CSV, or enter a store URL to preview a sample import. No account is required.</p></details><details name="v2-faq"><summary><span>Is it a website builder?</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></summary><p>The demo supports a website builder, catalog drafts, ad concepts, campaign tracking, budgets, orders, and customer conversations.</p></details><details name="v2-faq"><summary><span>Who is it for?</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></summary><p>You review changes before they are applied. Store publishing, ads, payments, and agent execution are simulated in this prototype.</p></details><details name="v2-faq"><summary><span>Can it break my live store?</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></summary><p>Your demo products and edits stay in this browser. URL imports use sample data; the entered website is never fetched.</p></details><details name="v2-faq"><summary><span>Can I bring my store and domain?</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></summary><p>You can explore Shopify, WooCommerce, advertising, and shipping connection states in Settings. These are demonstration states, not live connections.</p></details><details name="v2-faq"><summary><span>Do you take a cut of my sales?</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></summary><p>The prototype is free to explore. No subscription, payment details, or real advertising spend is involved.</p></details><details name="v2-faq"><summary><span>When can I try it?</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></summary><p>Start with Open demo. Settings lets you export your browser data or reset the workspace for another walkthrough.</p></details></div></div></section><section class="d-finale v2-dark" aria-labelledby="d-fin"><div class="d-finale-grid" aria-hidden="true"></div><figure class="d-float" style="--x:38%;--y:3%;--w:230px;--ar:1500/613;--i:0" aria-hidden="true"><img src="./public/assets/ui-looks.webp" alt="" loading="lazy" decoding="async" class="" style="object-position:50% 50%"></figure><figure class="d-float" style="--x:17%;--y:7%;--w:142px;--ar:3/4;--i:1" aria-hidden="true"><img src="./public/assets/store-okra.webp" alt="" loading="lazy" decoding="async" class="" style="object-position:50% 50%"></figure><figure class="d-float" style="--x:62%;--y:8%;--w:142px;--ar:3/4;--i:2" aria-hidden="true"><img src="./public/assets/store-sonic.webp" alt="" loading="lazy" decoding="async" class="" style="object-position:50% 50%"></figure><figure class="d-float" style="--x:83%;--y:15%;--w:142px;--ar:3/4;--i:3" aria-hidden="true"><img src="./public/assets/store-timber.webp" alt="" loading="lazy" decoding="async" class="" style="object-position:50% 50%"></figure><figure class="d-float" style="--x:3%;--y:33%;--w:230px;--ar:16/10;--i:4" aria-hidden="true"><img src="./public/assets/wall-aura.webp" alt="" loading="lazy" decoding="async" class="" style="object-position:50% 50%"></figure><figure class="d-float" style="--x:78%;--y:52%;--w:230px;--ar:16/10;--i:5" aria-hidden="true"><img src="./public/assets/wall-atelier.webp" alt="" loading="lazy" decoding="async" class="" style="object-position:50% 50%"></figure><figure class="d-float" style="--x:22%;--y:74%;--w:142px;--ar:3/4;--i:6" aria-hidden " role="img" aria-label="Meta">Meta</span></li><li class="d-chip m-chip"><span class="wm wm-ship">Shiprocket</span></li><li class="d-chip m-chip"><span class="wm wm-del">Delhivery</span></li><li class="d-chip m-chip"><span class="wm wm-tally">Tally</span></li><li class="d-chip m-chip"><span class="wm wm-stripe">stripe</span></li></ul></div></div><ul class="m-promises reveal"><li>Your own payment account</li><li>Your data, export any time</li><li>Your own AI keys</li></ul></section><section class="m-faq" id="m-faq"><p class="eyebrow-v reveal">Questions</p><h2 class="m-h2 reveal">The short <em>answers.</em></h2><div class="faq"><details name="v2-faq"><summary><span>What is RunMyStore?</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></summary><p>RunMyStore brings your storefront, catalog, ads, campaigns, and daily operations into one workspace. This interactive demo uses sample data saved in your browser.</p></details><details name="v2-faq"><summary><span>Is it an agency?</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></summary><p>Open the demo to explore Northwind, use a local catalog CSV, or enter a store URL to preview a sample import. No account is required.</p></details><details name="v2-faq"><summary><span>Is it a website builder?</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></summary><p>The demo supports a website builder, catalog drafts, ad concepts, campaign tracking, budgets, orders, and customer conversations.</p></details><details name="v2-faq"><summary><span>Who is it for?</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></summary><p>You review changes before they are applied. Store publishing, ads, payments, and agent execution are simulated in this prototype.</p></details><details name="v2-faq"><summary><span>Can it break my live store?</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></summary><p>Your demo products and edits stay in this browser. URL imports use sample data; the entered website is never fetched.</p></details><details name="v2-faq"><summary><span>Can I bring my store and domain?</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></summary><p>You can explore Shopify, WooCommerce, advertising, and shipping connection states in Settings. These are demonstration states, not live connections.</p></details><details name="v2-faq"><summary><span>Do you take a cut of my sales?</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></summary><p>The prototype is free to explore. No subscription, payment details, or real advertising spend is involved.</p></details><details name="v2-faq"><summary><span>When can I try it?</span><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></summary><p>Start with Open demo. Settings lets you export your browser data or reset the workspace for another walkthrough.</p></details></div></section><div class="m-sticky"><a href="/app/overview" class="btn-primary">Open demo \u2197</a></div></div><section class="m-finale v2-dark" aria-labelledby="m-fin"><div class="d-finale-grid" aria-hidden="true"></div><div class="m-rail" aria-hidden="true"><figure class="d-float m-float" style="--i:0"><img src="./public/assets/store-stride.webp" alt="" loading="lazy" decoding="async" class="" style="object-position:50% 50%"></figure><figure class="d-float m-float" style="--i:1"><img src="./public/assets/store-hollow.webp" alt="" loading="lazy" decoding="async" class="" style="object-position:50% 50%"></figure><figure class="d-float m-float" style="--i:2"><img src="./public/assets/store-ora.webp" alt="" loading="lazy" decoding="async" class="" style="object-position:50% 50%"></figure></div><h2 id="m-fin" class="m-h1 m-h1-sm">Give your store <em>a life of its own.</em></h2><form class="sb sb-m sb-dark" action="/onboarding"><label for="sb-m-fin" class="sr-only">Your store or site link</label><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-globe sb-globe" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d
